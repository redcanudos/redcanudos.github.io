<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Time · RED CANUDOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Configurações PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e50914">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            overflow-x: hidden;
        }
        .main-container {
            max-width: 100% !important;
            width: 100% !important;
            padding: 2rem 2.5rem !important;
            box-sizing: border-box;
        }
        .sidebar-card {
            max-width: 100% !important;
            width: 100% !important;
            box-sizing: border-box;
        }
        .roster-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)) !important;
            gap: 1.5rem !important;
            margin-top: 1.5rem !important;
            width: 100% !important;
        }
        @media (max-width: 768px) {
            .main-container {
                padding: 1rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR PADRONIZADA -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo-brand">
                <img src="Logo Canudos.png" alt="RED Canudos Logo" class="nav-logo">
                <span class="brand-name"><span class="red-text">RED</span> CANUDOS</span>
            </a>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="times.html" class="active">Times</a>
                <a href="jogadores.html">Jogadores</a>
                <a href="partidas.html">Partidas</a>
                <a href="tabela.html">Tabela</a>
                <a href="estatisticas.html">Estatísticas</a>
                <a href="noticia.html">Notícias</a>
                <a href="hall.html">Hall of Canudos</a>
                <a href="regras.html">Regras</a>
            </nav>
            <div class="menu-toggle" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </header>

    <main class="main-container">
        
        <div style="margin-bottom: 1.5rem;">
            <a href="times.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; font-weight: 700;"><i class="fa-solid fa-arrow-left"></i> Voltar para Times</a>
        </div>

        <!-- CABEÇALHO DO TIME -->
        <section class="sidebar-card" style="padding: 2.5rem; text-align: center; margin-bottom: 2rem;">
            <div id="timeHeader">
                <p class="loading-text">Carregando informações da equipe...</p>
            </div>
        </section>

        <!-- PLANTEL / JOGADORES DO TIME -->
        <section class="sidebar-card" style="padding: 2rem;">
            <div class="section-title-bar">
                <h2><i class="fa-solid fa-users"></i> PLANTEL DA EQUIPE</h2>
            </div>

            <div id="gridJogadoresTime" class="roster-grid">
                <p class="loading-text">Carregando jogadores...</p>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>RED CANUDOS © 2026 · O TORNEIO DA MATILHA</p>
    </footer>

    <script src="script.js"></script>

    <!-- FIREBASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3g6QE7YBg0vEAYoCoZa4lI3hc2_C-J4Y",
            authDomain: "canudos-200c7.firebaseapp.com",
            projectId: "canudos-200c7",
            storageBucket: "canudos-200c7.firebasestorage.app",
            messagingSenderId: "1055281066343",
            appId: "1:1055281066343:web:80afb45157dacbe503bfc2",
            measurementId: "G-JEP4G8QFHE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const nomeTime = decodeURIComponent(urlParams.get('time') || '');

        async function carregarPerfilTime() {
            if (!nomeTime) {
                document.getElementById('timeHeader').innerHTML = '<h2>Time não especificado!</h2>';
                return;
            }

            try {
                const timeRef = doc(db, "tabela", nomeTime);
                const timeSnap = await getDoc(timeRef);

                if (!timeSnap.exists()) {
                    document.getElementById('timeHeader').innerHTML = '<h2>Time não encontrado!</h2>';
                    return;
                }

                const dados = timeSnap.data();
                const vitorias = dados.vitorias || 0;
                const derrotas = dados.derrotas || 0;
                const pontos = dados.pontos || (vitorias * 3);

                let logoHtml = '';
                if (dados.logoUrl && dados.logoUrl.trim() !== '') {
                    logoHtml = `<img src="${dados.logoUrl}" alt="${nomeTime}" style="width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 3px solid var(--red-primary); margin: 0 auto 1.2rem auto; box-shadow: 0 4px 15px rgba(229,9,20,0.3);">`;
                } else {
                    logoHtml = `<div style="width: 100px; height: 100px; background: var(--bg-main); border: 3px solid var(--red-primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; font-weight: 900; color: #fff; margin: 0 auto 1.2rem auto; box-shadow: 0 4px 15px rgba(229,9,20,0.3);">${nomeTime.charAt(0)}</div>`;
                }

                document.getElementById('timeHeader').innerHTML = `
                    ${logoHtml}
                    <h1 style="font-size: 2.2rem; color: #fff; margin-bottom: 0.3rem;">${nomeTime} ${dados.tag ? `[${dados.tag}]` : ''}</h1>
                    <div style="display: flex; justify-content: center; gap: 2rem; font-size: 0.95rem; margin-top: 1.5rem;">
                        <div><span style="color: var(--text-muted); display: block; font-size: 0.75rem;">VITÓRIAS</span> <strong style="color: #00e676; font-size: 1.2rem;">${vitorias}</strong></div>
                        <div><span style="color: var(--text-muted); display: block; font-size: 0.75rem;">DERROTAS</span> <strong style="color: #ff5252; font-size: 1.2rem;">${derrotas}</strong></div>
                        <div><span style="color: var(--text-muted); display: block; font-size: 0.75rem;">PONTOS</span> <strong style="color: var(--red-primary); font-size: 1.2rem;">${pontos}</strong></div>
                    </div>
                `;

                const gridJogadores = document.getElementById('gridJogadoresTime');
                const plantel = dados.plantel || [];

                if (plantel.length === 0) {
                    gridJogadores.innerHTML = '<p class="empty-text">Nenhum jogador cadastrado no plantel desta equipe ainda.</p>';
                    return;
                }

                gridJogadores.innerHTML = '';
                plantel.forEach(j => {
                    const cardJ = document.createElement('div');
                    cardJ.style.background = 'var(--bg-main)';
                    cardJ.style.border = '1px solid var(--border-color)';
                    cardJ.style.borderRadius = '8px';
                    cardJ.style.padding = '1.5rem 1rem';
                    cardJ.style.textAlign = 'center';
                    cardJ.style.display = 'flex';
                    cardJ.style.flexDirection = 'column';
                    cardJ.style.alignItems = 'center';
                    cardJ.style.justifyContent = 'space-between';
                    cardJ.style.transition = 'transform 0.2s, border-color 0.2s';

                    cardJ.onmouseover = () => { cardJ.style.transform = 'translateY(-4px)'; cardJ.style.borderColor = 'var(--red-primary)'; };
                    cardJ.onmouseout = () => { cardJ.style.transform = 'translateY(0)'; cardJ.style.borderColor = 'var(--border-color)'; };

                    let avatarHtml = '';
                    if (j.fotoUrl && j.fotoUrl.trim() !== '') {
                        avatarHtml = `<img src="${j.fotoUrl}" alt="${j.nick}" style="width: 75px; height: 75px; object-fit: cover; border-radius: 50%; border: 2px solid var(--red-primary); margin: 0 auto 0.8rem auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">`;
                    } else {
                        avatarHtml = `<div style="width: 75px; height: 75px; background: #232732; border: 1px solid var(--border-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.8rem auto; color: var(--red-primary); font-size: 1.5rem; font-weight: bold;"><i class="fa-solid fa-user"></i></div>`;
                    }

                    let opggBtn = '';
                    if (j.opgg && j.opgg.trim() !== '') {
                        opggBtn = `<a href="${j.opgg}" target="_blank" style="display: inline-block; margin-top: 0.8rem; background: #31313c; color: #5383e8; border: 1px solid #5383e855; padding: 0.3rem 0.7rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; text-decoration: none;"><i class="fa-solid fa-external-link-alt"></i> OP.GG</a>`;
                    }

                    cardJ.innerHTML = `
                        <div>
                            ${avatarHtml}
                            <h3 style="color: #fff; font-size: 1.05rem; margin-bottom: 0.3rem;">${j.nick}</h3>
                            <span style="color: var(--red-primary); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; background: rgba(229,9,20,0.1); padding: 0.25rem 0.7rem; border-radius: 4px; display: inline-block;">${j.funcao || 'Titular'}</span>
                        </div>
                        <div>${opggBtn}</div>
                    `;
                    gridJogadores.appendChild(cardJ);
                });
            } catch (err) {
                console.error("Erro ao carregar perfil do time:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', carregarPerfilTime);
    </script>
</body>
</html>

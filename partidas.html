<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partidas · RED CANUDOS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Configurações PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#e50914">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

    <!-- NAVBAR PADRONIZADA -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo-brand">
                <img src="Logo Canudos.png" alt="RED Canudos Logo" class="nav-logo">
                <span class="brand-name"><span class="red-text">RED</span> CANUDOS</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="times.html">Times</a>
                <a href="jogadores.html">Jogadores</a>
                <a href="partidas.html" class="active">Partidas</a>
                <a href="tabela.html">Tabela</a>
                <a href="estatisticas.html">Estatísticas</a>
                <a href="regras.html">Regras</a>
                <a href="hall.html">Hall of Canudos</a>
            </nav>
            <div class="menu-toggle" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
    </header>

    <main class="main-container">
        
        <div class="banner-hero">
            <div class="banner-content">
                <h1>HISTÓRICO DE PARTIDAS</h1>
                <p class="banner-subtitle">RED CANUDOS · CONFIRA OS CONFRONTOS DA TEMPORADA</p>
            </div>
        </div>

        <section class="sidebar-card" style="margin-bottom: 2rem;">
            <div class="section-title-bar">
                <h2><i class="fa-solid fa-gamepad"></i> TODOS OS CONFRONTOS</h2>
            </div>

            <div id="gridPartidas" class="admin-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
                <p class="loading-text">Carregando histórico de partidas...</p>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>RED CANUDOS © 2026 · O TORNEIO DA MATILHA</p>
    </footer>

    <script src="script.js"></script>

    <!-- FIREBASE SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3g6QE7YBg0vEAYoCoZa4lI3hc2_C-J4Y",
            authDomain: "canudos-200c7.firebaseapp.com",
            projectId: "canudos-200c7",
            storageBucket: "canudos-200c7.firebasestorage.app",
            messagingSenderId: "1055281066343",
            appId: "1:1055281066343:web:80afb45157dacbe503bfc2",
            measurementId: "G-JEP4G8QFHE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function carregarPartidas() {
            const container = document.getElementById('gridPartidas');
            try {
                const q = query(collection(db, "partidas"), orderBy("createdAt", "asc"));
                const snap = await getDocs(q);

                if (snap.empty) {
                    container.innerHTML = '<p class="empty-text">Nenhuma partida registrada ainda.</p>';
                    return;
                }

                // Agrupa os mapas rigorosamente pela chave unificada dos dois times (indor-sensível e ordem alfabética)
                const seriesMap = {};
                snap.forEach(docSnap => {
                    const p = docSnap.data();
                    let chave = p.confrontoChave;
                    if (!chave && p.homeTeam && p.awayTeam) {
                        const timesOrd = [p.homeTeam.trim(), p.awayTeam.trim()].sort();
                        chave = `${timesOrd[0]}_${timesOrd[1]}`.toLowerCase().replace(/\s+/g, '_');
                    }
                    chave = chave || 'partida_geral';
                    
                    if (!seriesMap[chave]) {
                        // Define os nomes oficiais da série com base nos primeiros times encontrados
                        seriesMap[chave] = {
                            homeTeam: p.homeTeam,
                            awayTeam: p.awayTeam,
                            data: p.data,
                            mapas: []
                        };
                    }
                    seriesMap[chave].mapas.push({ id: docSnap.id, ...p });
                });

                container.innerHTML = '';
                Object.keys(seriesMap).forEach(chave => {
                    const serie = seriesMap[chave];
                    
                    // Calcula quantas vitórias cada time teve nos mapas da série
                    let vitoriasHome = 0;
                    let vitoriasAway = 0;

                    serie.mapas.forEach(m => {
                        const vencedor = m.vencedorMapa ? m.vencedorMapa.trim().toLowerCase() : '';
                        const timeHome = serie.homeTeam.trim().toLowerCase();

                        if (vencedor === timeHome) {
                            vitoriasHome++;
                        } else {
                            vitoriasAway++;
                        }
                    });

                    // Lista os mapas individuais dentro do card
                    let mapasHtml = serie.mapas.map((m, index) => `
                        <div style="display:flex; justify-content:space-between; font-size:0.8rem; background:var(--bg-main); padding:0.4rem 0.8rem; border-radius:4px; margin-top:0.4rem; align-items:center;">
                            <span style="color:var(--text-muted); font-weight:700;">Mapa ${index + 1}</span>
                            <span>${m.homeTeam} <strong>${m.homeScore} - ${m.awayScore}</strong> ${m.awayTeam}</span>
                            <a href="detalhes-partida.html?id=${m.id}" style="color:var(--red-primary); text-decoration:none; font-weight:700;"><i class="fa-solid fa-eye"></i></a>
                        </div>
                    `).join('');

                    const card = document.createElement('div');
                    card.className = 'sidebar-card';
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';
                    card.style.justifyContent = 'space-between';
                    card.style.padding = '1.2rem';

                    card.innerHTML = `
                        <div>
                            <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted); margin-bottom:0.8rem; font-weight:700;">
                                <span><i class="fa-regular fa-calendar"></i> ${serie.data || ''}</span>
                                <span style="color:var(--red-primary);">SÉRIE MD3</span>
                            </div>
                            <div style="display:flex; align-items:center; justify-content:space-between; text-align:center; margin:0.8rem 0;">
                                <div style="flex:1;">
                                    <strong style="font-size:0.95rem; display:block;">${serie.homeTeam}</strong>
                                </div>
                                <div style="padding:0 0.8rem; font-size:1.4rem; font-weight:900; color:var(--red-primary);">
                                    ${vitoriasHome} - ${vitoriasAway}
                                </div>
                                <div style="flex:1;">
                                    <strong style="font-size:0.95rem; display:block;">${serie.awayTeam}</strong>
                                </div>
                            </div>
                            <div style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.8rem;">
                                <span style="font-size: 0.75rem; color: var(--text-muted); font-weight: 800; display: block; margin-bottom: 0.3rem;">PARTIDAS DA SÉRIE:</span>
                                ${mapasHtml}
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Erro ao carregar partidas:", err);
                container.innerHTML = '<p class="empty-text">Erro ao carregar partidas.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', carregarPartidas);
    </script>
</body>
</html>
